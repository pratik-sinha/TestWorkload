name: Build and Deploy to ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-test-project-0beb-my-test-app-ecr-repo
  ECS_CLUSTER: my-test-project-0beb8486-cluster
  ECS_SERVICE: my-test-project-0beb-my-test-app-service
  CONTAINER_NAME: my-test-project-0beb-my-test-app-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      

      # Assumes the narrowly-scoped github-actions-deploy role, NOT platformProvisioner.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::773079261687:role/github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_TAG="${IMAGE_TAG:0:5}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG" >> "$GITHUB_OUTPUT"

      # Pulls the CURRENT live task definition (owned by OpenTofu) so only the
      # image reference changes - everything else (roles, networking, etc.)
      # stays exactly as OpenTofu provisioned it.

      - name: Fetch current task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Registers a new task def revision and calls update-service.
      # Does NOT create or modify the service itself - that's OpenTofu's job.
      - name: Deploy new task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true